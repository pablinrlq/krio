# KRIÔ em um servidor próprio (VPS): site + plataforma, banco, HTTPS e backup.
# Uso: copie .env.example para .env, preencha e rode `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://krio:${POSTGRES_PASSWORD}@db:5432/krio
      DATA_DIR: /data
      APP_URL: https://${DOMAIN}
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: krio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: krio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U krio']
      interval: 5s
      retries: 10

  # Cópia do banco todo dia, guardada por 14 dias em ./backups.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: krio
      POSTGRES_USER: krio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 14
    volumes:
      - ./backups:/backups
    depends_on:
      - db

  # HTTPS automático (Let's Encrypt) na frente do app.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
